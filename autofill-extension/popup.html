<!doctype html>
<meta charset="utf-8">
<title>Auto Login</title>
<style>
  body { width: 290px; margin: 0; font: 13px/1.55 -apple-system, "Noto Sans TC", system-ui, sans-serif;
         color: #111827; background: #fff; }
  .hd { padding: 11px 14px; background: #3b82f6; color: #fff; font-weight: 600; }
  .bd { padding: 12px 14px; }
  .host { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #6b7280;
          word-break: break-all; margin-bottom: 10px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; margin-bottom:8px; }
  .on  { background:#dcfce7; color:#166534; }
  .off { background:#f3f4f6; color:#4b5563; }
  .need{ background:#fef3c7; color:#92400e; }
  button { width:100%; padding:8px; margin-top:7px; border-radius:8px; border:1px solid #d1d5db;
           background:#f9fafb; font-size:13px; cursor:pointer; color:#111827; }
  button.pri { background:#3b82f6; border-color:#3b82f6; color:#fff; font-weight:600; }
  button:hover:not(:disabled) { filter: brightness(.97); }
  button:disabled { opacity:.5; cursor:default; }
  a { display:block; margin-top:11px; text-align:center; color:#3b82f6; font-size:12px; }
  .msg { margin-top:9px; padding:7px 9px; background:#eff6ff; color:#1e40af; border-radius:7px; font-size:12px; }
</style>
<div class="hd">Auto Login</div>
<div class="bd">
  <div id="host" class="host"></div>
  <div id="state"></div>
  <button id="learn" class="pri">設定這個網站</button>
  <button id="fill">立即填入</button>
  <a href="#" id="opts">管理全部設定 →</a>
  <div id="msg" class="msg" hidden></div>
</div>
<script src="popup.js"></script>
