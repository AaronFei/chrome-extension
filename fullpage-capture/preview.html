<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>整頁截圖 — 預覽</title>
<style>
  :root { color-scheme: light dark; --bg:#f3f4f6; --panel:#fff; --fg:#111827; --mut:#6b7280;
          --line:#e5e7eb; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --panel:#1c1c1f; --fg:#f4f4f5; --mut:#a1a1aa; --line:#3f3f46; --acc:#3b82f6; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .meta { min-width:0; flex:1; }
  .meta .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta .s { font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { padding:7px 12px; border-radius:7px; border:1px solid var(--line); background:var(--panel);
           color:var(--fg); font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button.primary:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  .dims { font-variant-numeric:tabular-nums; font-size:12px; color:var(--mut); white-space:nowrap;
          display:flex; gap:6px; align-items:center; }
  .dims label { display:flex; gap:3px; align-items:center; }
  .dims input { width:64px; padding:5px 6px; border:1px solid var(--line); border-radius:6px;
                background:var(--panel); color:var(--fg); font:inherit; font-variant-numeric:tabular-nums; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff;
           padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
           transition:opacity .2s; z-index:10; }
  #toast.show { opacity:1; }
  #toast.err { background:#b91c1c; }
  main { padding:16px; }
  main.full { overflow:auto; }
  /* width:fit-content + margin auto：外框剛好包住圖片，然後置中。
     用 flex 置中的話 .stage 會被拉成滿版，圖片就會貼在左邊。 */
  .stage { position:relative; display:block; width:fit-content; margin:0 auto; line-height:0;
           box-shadow:0 2px 14px rgba(0,0,0,.18); border-radius:4px; }
  main.full .stage { margin:0; }
  img { display:block; background:#fff; border-radius:4px; }
  img.fit { max-width:min(1100px, calc(100vw - 32px)); height:auto; }
  .empty { padding:60px; color:var(--mut); text-align:center; }

  /* 裁切 */
  .stage.cropping img { border-radius:0; }
  #cropbox { position:absolute; display:none; border:1px solid rgba(255,255,255,.9);
             outline:1px solid rgba(0,0,0,.55); box-shadow:0 0 0 9999px rgba(0,0,0,.5);
             cursor:move; touch-action:none; }
  .stage.cropping #cropbox { display:block; }
  #cropbox .h { position:absolute; width:14px; height:14px; background:#fff; border:1px solid #111827;
                border-radius:2px; touch-action:none; }
  #cropbox .h.nw{left:-7px;top:-7px;cursor:nwse-resize} #cropbox .h.ne{right:-7px;top:-7px;cursor:nesw-resize}
  #cropbox .h.sw{left:-7px;bottom:-7px;cursor:nesw-resize} #cropbox .h.se{right:-7px;bottom:-7px;cursor:nwse-resize}
  #cropbox .h.n{left:50%;top:-7px;margin-left:-7px;cursor:ns-resize}
  #cropbox .h.s{left:50%;bottom:-7px;margin-left:-7px;cursor:ns-resize}
  #cropbox .h.w{top:50%;left:-7px;margin-top:-7px;cursor:ew-resize}
  #cropbox .h.e{top:50%;right:-7px;margin-top:-7px;cursor:ew-resize}
  #cropbox .grid { position:absolute; inset:0; pointer-events:none;
                   background:
                     linear-gradient(to right, transparent 33.33%, rgba(255,255,255,.35) 33.33%, rgba(255,255,255,.35) calc(33.33% + 1px), transparent calc(33.33% + 1px), transparent 66.66%, rgba(255,255,255,.35) 66.66%, rgba(255,255,255,.35) calc(66.66% + 1px), transparent calc(66.66% + 1px)),
                     linear-gradient(to bottom, transparent 33.33%, rgba(255,255,255,.35) 33.33%, rgba(255,255,255,.35) calc(33.33% + 1px), transparent calc(33.33% + 1px), transparent 66.66%, rgba(255,255,255,.35) 66.66%, rgba(255,255,255,.35) calc(66.66% + 1px), transparent calc(66.66% + 1px)); }
  .hide { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="meta">
    <div class="t" id="title">—</div>
    <div class="s" id="sub"></div>
  </div>
  <div class="actions" id="normalBar">
    <button class="primary" id="png">下載 PNG</button>
    <button id="copy">複製到剪貼簿</button>
    <button id="pdf">存成 PDF</button>
    <button id="crop">裁切</button>
    <button id="revert" class="hide">還原原圖</button>
    <button id="zoom">實際大小</button>
  </div>
  <div class="actions hide" id="cropBar">
    <span class="dims" id="cropDims">
      <label>X<input id="cx" type="number" min="0" step="1"></label>
      <label>Y<input id="cy" type="number" min="0" step="1"></label>
      <label>寬<input id="cw" type="number" min="10" step="1"></label>
      <label>高<input id="ch" type="number" min="10" step="1"></label>
    </span>
    <button id="cropAll">全選</button>
    <button id="cropCancel">取消</button>
    <button class="primary" id="cropApply">套用裁切</button>
  </div>
</header>
<main id="main"><div class="empty" id="empty">載入中…</div></main>
<div id="toast"></div>
<script type="module" src="preview.js"></script>
</body>
</html>
